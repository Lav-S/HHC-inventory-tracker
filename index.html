<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Expiry Tracker</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;

        // Supabase Configuration - REPLACE WITH YOUR OWN VALUES
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Icons
        const Calendar = () => (
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
        );

        const Mail = () => (
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
        );

        const Upload = () => (
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
        );

        const Plus = () => (
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        );

        const Minus = () => (
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        );

        const Trash = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
        );

        const Download = () => (
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
        );

        const AlertCircle = () => (
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
        );

        const X = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        );

        const LogOut = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
        );

        const Package = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M16.5 9.4l-9-5.19M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                <line x1="12" y1="22.08" x2="12" y2="12"></line>
            </svg>
        );

        function LoginPage({ onLogin }) {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                if (username.toLowerCase() === 'hard hat cafe' && password === 'Cafessap1!') {
                    onLogin();
                } else {
                    setError('Invalid username or password');
                    setTimeout(() => setError(''), 3000);
                }
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center p-6">
                    <div className="bg-white rounded-lg shadow-2xl p-8 w-full max-w-md">
                        <div className="flex items-center justify-center mb-6">
                            <Calendar />
                            <h1 className="text-3xl font-bold text-gray-800 ml-3">Inventory Tracker</h1>
                        </div>
                        <p className="text-gray-600 text-center mb-8">Sign in to access your inventory</p>
                        
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Username</label>
                                <input
                                    type="text"
                                    value={username}
                                    onChange={(e) => setUsername(e.target.value)}
                                    className="w-full px-4 py-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                    placeholder="Enter username"
                                    required
                                />
                            </div>
                            
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Password</label>
                                <input
                                    type="password"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    className="w-full px-4 py-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                    placeholder="Enter password"
                                    required
                                />
                            </div>

                            {error && (
                                <div className="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
                                    {error}
                                </div>
                            )}

                            <button
                                type="submit"
                                className="w-full bg-indigo-600 text-white py-3 rounded-md hover:bg-indigo-700 transition font-semibold"
                            >
                                Sign In
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        function InventoryTracker() {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [items, setItems] = useState([]);
            const [emailConfig, setEmailConfig] = useState({
                emails: [],
                monthsBefore: 6,
                weeksBefore: 2,
                daysBefore: 7,
                publicKey: '',
                serviceId: '',
                templateId: '',
                automationEnabled: false,
                lastCheckDate: null
            });
            const [newEmail, setNewEmail] = useState('');
            const [newItem, setNewItem] = useState({ name: '', expiryDate: '', category: '', quantity: 1 });
            const [loading, setLoading] = useState(true);
            const [emailStatus, setEmailStatus] = useState('');
            const [setupComplete, setSetupComplete] = useState(false);
            const [syncStatus, setSyncStatus] = useState('');
            const [showConfig, setShowConfig] = useState(false);

            useEffect(() => {
                const loggedIn = localStorage.getItem('isLoggedIn');
                if (loggedIn === 'true') {
                    setIsLoggedIn(true);
                    loadDataFromSupabase();
                } else {
                    setLoading(false);
                }
            }, []);

            useEffect(() => {
                if (emailConfig.publicKey && emailConfig.serviceId && emailConfig.templateId) {
                    setSetupComplete(true);
                }
            }, [emailConfig]);

            useEffect(() => {
                if (isLoggedIn && emailConfig.automationEnabled) {
                    checkAndSendAutomatedEmails();
                }
            }, [isLoggedIn]);

            const handleLogin = () => {
                localStorage.setItem('isLoggedIn', 'true');
                setIsLoggedIn(true);
                setShowConfig(false);
                loadDataFromSupabase();
            };

            const handleLogout = () => {
                localStorage.removeItem('isLoggedIn');
                setIsLoggedIn(false);
            };

            const loadDataFromSupabase = async () => {
                setSyncStatus('Loading...');
                try {
                    // Load items
                    const { data: itemsData, error: itemsError } = await supabase
                        .from('inventory_items')
                        .select('*')
                        .order('expiry_date', { ascending: true });

                    if (itemsError && itemsError.code !== 'PGRST116') {
                        throw itemsError;
                    }

                    if (itemsData && itemsData.length > 0) {
                        const loadedItems = itemsData.map(item => ({
                            id: item.id,
                            name: item.name,
                            expiryDate: item.expiry_date,
                            category: item.category || '',
                            quantity: item.quantity || 0,
                            addedDate: item.added_date,
                            lastEmailSent: item.last_email_sent
                        }));
                        setItems(loadedItems);
                    }

                    // Load email config
                    const { data: configData, error: configError } = await supabase
                        .from('email_config')
                        .select('*')
                        .eq('id', 1)
                        .single();

                    if (configError && configError.code !== 'PGRST116') {
                        console.log('Config error:', configError);
                    }

                    if (configData) {
                        setEmailConfig({
                            emails: configData.emails || [],
                            monthsBefore: configData.months_before || 6,
                            weeksBefore: configData.weeks_before || 2,
                            daysBefore: configData.days_before || 7,
                            publicKey: configData.public_key || '',
                            serviceId: configData.service_id || '',
                            templateId: configData.template_id || '',
                            automationEnabled: configData.automation_enabled || false,
                            lastCheckDate: configData.last_check_date
                        });
                    }

                    setSyncStatus('✅ Synced');
                    setTimeout(() => setSyncStatus(''), 2000);
                } catch (error) {
                    console.error('Load error:', error);
                    setSyncStatus('⚠️ Sync failed - Check Supabase setup');
                    setTimeout(() => setSyncStatus(''), 5000);
                }
                setLoading(false);
            };

            const saveItemsToSupabase = async (itemsToSave) => {
                setSyncStatus('Syncing...');
                try {
                    // Delete all existing items
                    await supabase.from('inventory_items').delete().neq('id', 0);

                    // Insert new items
                    if (itemsToSave.length > 0) {
                        const itemsForDb = itemsToSave.map(item => ({
                            id: item.id,
                            name: item.name,
                            expiry_date: item.expiryDate,
                            category: item.category || '',
                            quantity: item.quantity || 0,
                            added_date: item.addedDate,
                            last_email_sent: item.lastEmailSent
                        }));

                        const { error } = await supabase
                            .from('inventory_items')
                            .insert(itemsForDb);

                        if (error) throw error;
                    }

                    setSyncStatus('✅ Synced');
                    setTimeout(() => setSyncStatus(''), 2000);
                } catch (error) {
                    console.error('Save items error:', error);
                    setSyncStatus('❌ Sync failed');
                    setTimeout(() => setSyncStatus(''), 3000);
                }
            };

            const saveConfigToSupabase = async (config) => {
                setSyncStatus('Syncing...');
                try {
                    const configForDb = {
                        id: 1,
                        emails: config.emails,
                        months_before: config.monthsBefore,
                        weeks_before: config.weeksBefore,
                        days_before: config.daysBefore,
                        public_key: config.publicKey,
                        service_id: config.serviceId,
                        template_id: config.templateId,
                        automation_enabled: config.automationEnabled,
                        last_check_date: config.lastCheckDate
                    };

                    const { error } = await supabase
                        .from('email_config')
                        .upsert(configForDb, { onConflict: 'id' });

                    if (error) throw error;

                    setSyncStatus('✅ Synced');
                    setTimeout(() => setSyncStatus(''), 2000);
                } catch (error) {
                    console.error('Save config error:', error);
                    setSyncStatus('❌ Sync failed');
                    setTimeout(() => setSyncStatus(''), 3000);
                }
            };

            const addEmail = () => {
                if (newEmail && newEmail.includes('@')) {
                    const updated = { ...emailConfig, emails: [...emailConfig.emails, newEmail] };
                    setEmailConfig(updated);
                    saveConfigToSupabase(updated);
                    setNewEmail('');
                } else {
                    alert('Please enter a valid email address');
                }
            };

            const removeEmail = (emailToRemove) => {
                const updated = { ...emailConfig, emails: emailConfig.emails.filter(e => e !== emailToRemove) };
                setEmailConfig(updated);
                saveConfigToSupabase(updated);
            };

            const addItem = () => {
                if (newItem.name && newItem.expiryDate) {
                    const updatedItems = [...items, { 
                        ...newItem, 
                        id: Date.now(), 
                        addedDate: new Date().toISOString(),
                        quantity: parseInt(newItem.quantity) || 1,
                        lastEmailSent: null
                    }];
                    setItems(updatedItems);
                    saveItemsToSupabase(updatedItems);
                    setNewItem({ name: '', expiryDate: '', category: '', quantity: 1 });
                }
            };

            const updateItemQuantity = (id, change) => {
                const updatedItems = items.map(item => {
                    if (item.id === id) {
                        const newQuantity = Math.max(0, (item.quantity || 0) + change);
                        return { ...item, quantity: newQuantity };
                    }
                    return item;
                });
                setItems(updatedItems);
                saveItemsToSupabase(updatedItems);
            };

            const deleteItem = (id) => {
                const updatedItems = items.filter(item => item.id !== id);
                setItems(updatedItems);
                saveItemsToSupabase(updatedItems);
            };

            const handleExcelUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        const data = new Uint8Array(evt.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const sheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[sheetName];
                        const json = XLSX.utils.sheet_to_json(worksheet);
                        
                        const importedItems = json.map((row, idx) => ({
                            id: Date.now() + idx,
                            name: row.Name || row.name || row.Item || row.item || '',
                            expiryDate: row['Expiry Date'] || row.expiryDate || row.expiry || row.Expiry || '',
                            category: row.Category || row.category || '',
                            quantity: parseInt(row.Quantity || row.quantity) || 1,
                            addedDate: new Date().toISOString(),
                            lastEmailSent: null
                        })).filter(item => item.name && item.expiryDate);

                        const updatedItems = [...items, ...importedItems];
                        setItems(updatedItems);
                        saveItemsToSupabase(updatedItems);
                        alert(`Imported ${importedItems.length} items successfully!`);
                    };
                    reader.readAsArrayBuffer(file);
                }
            };

            const exportToExcel = () => {
                const ws = XLSX.utils.json_to_sheet(items.map(item => ({
                    Name: item.name,
                    'Expiry Date': item.expiryDate,
                    Category: item.category,
                    Quantity: item.quantity || 0,
                    'Days Until Expiry': getDaysUntilExpiry(item.expiryDate)
                })));
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Inventory');
                XLSX.writeFile(wb, 'inventory-export.xlsx');
            };

            const getDaysUntilExpiry = (expiryDate) => {
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const expiry = new Date(expiryDate);
                expiry.setHours(0, 0, 0, 0);
                const diffTime = expiry - today;
                return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            };

            const getAlertStatus = (item) => {
                const daysUntil = getDaysUntilExpiry(item.expiryDate);
                const monthsInDays = emailConfig.monthsBefore * 30;
                const weeksInDays = emailConfig.weeksBefore * 7;
                
                if (daysUntil < 0) return { status: 'expired', color: 'bg-red-100 border-red-300', textColor: 'text-red-800' };
                if (daysUntil <= emailConfig.daysBefore) return { status: 'critical', color: 'bg-orange-100 border-orange-300', textColor: 'text-orange-800' };
                if (daysUntil <= weeksInDays) return { status: 'warning', color: 'bg-yellow-100 border-yellow-300', textColor: 'text-yellow-800' };
                if (daysUntil <= monthsInDays) return { status: 'notice', color: 'bg-blue-100 border-blue-300', textColor: 'text-blue-800' };
                return { status: 'ok', color: 'bg-green-100 border-green-300', textColor: 'text-green-800' };
            };

            const updateEmailConfig = (field, value) => {
                const updated = { ...emailConfig, [field]: value };
                setEmailConfig(updated);
                saveConfigToSupabase(updated);
            };

            const shouldSendEmailForItem = (item) => {
                const daysUntil = getDaysUntilExpiry(item.expiryDate);
                const monthsInDays = emailConfig.monthsBefore * 30;
                const weeksInDays = emailConfig.weeksBefore * 7;
                
                if (daysUntil < 0 || 
                    daysUntil === emailConfig.daysBefore || 
                    daysUntil === weeksInDays || 
                    daysUntil === monthsInDays) {
                    
                    const lastSent = item.lastEmailSent ? new Date(item.lastEmailSent) : null;
                    const now = new Date();
                    const daysSinceLastEmail = lastSent ? Math.floor((now - lastSent) / (1000 * 60 * 60 * 24)) : 999;
                    
                    return daysSinceLastEmail >= 7;
                }
                return false;
            };

            const checkAndSendAutomatedEmails = async () => {
                // Reload fresh config from Supabase to get latest email list
                try {
                    const { data: configData } = await supabase
                        .from('email_config')
                        .select('*')
                        .eq('id', 1)
                        .single();

                    if (!configData || !configData.automation_enabled || !configData.emails || configData.emails.length === 0) {
                        return;
                    }

                    const freshConfig = {
                        emails: configData.emails || [],
                        monthsBefore: configData.months_before || 6,
                        weeksBefore: configData.weeks_before || 2,
                        daysBefore: configData.days_before || 7,
                        publicKey: configData.public_key || '',
                        serviceId: configData.service_id || '',
                        templateId: configData.template_id || '',
                        automationEnabled: configData.automation_enabled || false,
                        lastCheckDate: configData.last_check_date
                    };

                    if (!freshConfig.publicKey || !freshConfig.serviceId || !freshConfig.templateId) {
                        return;
                    }

                    const now = new Date();
                    const lastCheck = freshConfig.lastCheckDate ? new Date(freshConfig.lastCheckDate) : null;
                    const hoursSinceCheck = lastCheck ? (now - lastCheck) / (1000 * 60 * 60) : 999;

                    if (hoursSinceCheck < 24) {
                        return;
                    }

                    const itemsToEmail = items.filter(item => shouldSendEmailForItem(item));

                    if (itemsToEmail.length === 0) {
                        await supabase
                            .from('email_config')
                            .update({ last_check_date: now.toISOString() })
                            .eq('id', 1);
                        return;
                    }

                    emailjs.init(freshConfig.publicKey);

                    for (const item of itemsToEmail) {
                        const daysUntil = getDaysUntilExpiry(item.expiryDate);
                        
                        let urgentText = '';
                        if (daysUntil < 0) {
                            urgentText = 'EXPIRED';
                        } else if (daysUntil === 0) {
                            urgentText = 'expires TODAY';
                        } else if (daysUntil === 1) {
                            urgentText = 'expires TOMORROW';
                        } else {
                            urgentText = `expires in ${daysUntil} days`;
                        }

                        const templateParams = {
                            item_name: item.name,
                            expiry_date: item.expiryDate,
                            days_until: daysUntil,
                            urgent_text: urgentText,
                            quantity: item.quantity || 0,
                            category: item.category || 'N/A',
                            alert_date: new Date().toLocaleDateString()
                        };

                        // Use fresh email list from database
                        for (const email of freshConfig.emails) {
                            try {
                                await emailjs.send(
                                    freshConfig.serviceId,
                                    freshConfig.templateId,
                                    { ...templateParams, to_email: email }
                                );
                            } catch (error) {
                                console.error(`Failed to send to ${email}:`, error);
                            }
                        }

                        const updatedItems = items.map(i => 
                            i.id === item.id ? { ...i, lastEmailSent: now.toISOString() } : i
                        );
                        setItems(updatedItems);
                        await saveItemsToSupabase(updatedItems);
                    }

                    await supabase
                        .from('email_config')
                        .update({ last_check_date: now.toISOString() })
                        .eq('id', 1);

                } catch (error) {
                    console.error('Automated email error:', error);
                }
            };

            const sendManualTestEmail = async (item) => {
                if (!setupComplete || emailConfig.emails.length === 0) {
                    alert('Please complete setup first!');
                    return;
                }

                setEmailStatus(`Sending email for ${item.name}...`);

                try {
                    emailjs.init(emailConfig.publicKey);

                    const daysUntil = getDaysUntilExpiry(item.expiryDate);
                    let urgentText = '';
                    if (daysUntil < 0) {
                        urgentText = 'EXPIRED';
                    } else if (daysUntil === 0) {
                        urgentText = 'expires TODAY';
                    } else if (daysUntil === 1) {
                        urgentText = 'expires TOMORROW';
                    } else {
                        urgentText = `expires in ${daysUntil} days`;
                    }

                    const templateParams = {
                        item_name: item.name,
                        expiry_date: item.expiryDate,
                        days_until: daysUntil,
                        urgent_text: urgentText,
                        quantity: item.quantity || 0,
                        category: item.category || 'N/A',
                        alert_date: new Date().toLocaleDateString()
                    };

                    for (const email of emailConfig.emails) {
                        await emailjs.send(
                            emailConfig.serviceId,
                            emailConfig.templateId,
                            { ...templateParams, to_email: email }
                        );
                    }

                    setEmailStatus(`✅ Email sent for ${item.name}!`);
                    setTimeout(() => setEmailStatus(''), 3000);
                } catch (error) {
                    console.error('Email error:', error);
                    setEmailStatus('❌ Failed to send email');
                }
            };

            if (!isLoggedIn) {
                return <LoginPage onLogin={handleLogin} />;
            }

            if (loading) return <div className="flex items-center justify-center h-screen">Loading...</div>;

            const sortedItems = [...items].sort((a, b) => getDaysUntilExpiry(a.expiryDate) - getDaysUntilExpiry(b.expiryDate));

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-6">
                    <div className="max-w-6xl mx-auto">
                        <div className="bg-white rounded-lg shadow-xl p-6 mb-6 flex justify-between items-center">
                            <div>
                                <h1 className="text-3xl font-bold text-gray-800 mb-2 flex items-center gap-2">
                                    <Calendar />
                                    Inventory Expiry Tracker
                                </h1>
                                <p className="text-gray-600">Automated weekly email alerts • {syncStatus || 'Cloud synced via Supabase'}</p>
                            </div>
                            <button
                                onClick={handleLogout}
                                className="bg-red-600 text-white px-4 py-2 rounded-md hover:bg-red-700 transition flex items-center gap-2"
                            >
                                <LogOut />
                                Logout
                            </button>
                        </div>

                        {!setupComplete && (
                            <div className="bg-yellow-50 border-2 border-yellow-300 rounded-lg p-6 mb-6">
                                <h3 className="font-bold text-lg text-yellow-800 mb-2">⚠️ Setup Required</h3>
                                <p className="text-yellow-700">Complete the EmailJS configuration below to enable automated email alerts!</p>
                            </div>
                        )}

                        <div className="grid md:grid-cols-2 gap-6 mb-6">
                            <div className="bg-white rounded-lg shadow-lg p-6">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-xl font-semibold flex items-center gap-2">
                                        <Mail />
                                        Email Alert Settings
                                    </h2>
                                    {setupComplete && (
                                        <button
                                            onClick={() => setShowConfig(!showConfig)}
                                            className="text-sm bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded-md transition"
                                        >
                                            {showConfig ? 'Hide Config' : 'Show Config'}
                                        </button>
                                    )}
                                </div>
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-2">Email Recipients ({emailConfig.emails.length})</label>
                                        <div className="flex gap-2 mb-2">
                                            <input
                                                type="email"
                                                value={newEmail}
                                                onChange={(e) => setNewEmail(e.target.value)}
                                                onKeyPress={(e) => e.key === 'Enter' && addEmail()}
                                                className="flex-1 px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500"
                                                placeholder="Add email address"
                                            />
                                            <button
                                                onClick={addEmail}
                                                className="bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700 transition"
                                            >
                                                Add
                                            </button>
                                        </div>
                                        <div className="space-y-2 max-h-32 overflow-y-auto">
                                            {emailConfig.emails.map((email, idx) => (
                                                <div key={idx} className="flex items-center justify-between bg-gray-100 px-3 py-2 rounded">
                                                    <span className="text-sm">{email}</span>
                                                    <button
                                                        onClick={() => removeEmail(email)}
                                                        className="text-red-600 hover:text-red-800"
                                                    >
                                                        <X />
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    {(showConfig || !setupComplete) && (
                                        <>
                                            <div className="border-t pt-4">
                                                <h3 className="font-semibold text-sm text-gray-700 mb-2">EmailJS Configuration</h3>
                                                <div className="space-y-2">
                                                    <input
                                                        type="text"
                                                        value={emailConfig.publicKey}
                                                        onChange={(e) => updateEmailConfig('publicKey', e.target.value)}
                                                        className="w-full px-3 py-2 border border-gray-300 rounded-md text-sm"
                                                        placeholder="Public Key"
                                                    />
                                                    <input
                                                        type="text"
                                                        value={emailConfig.serviceId}
                                                        onChange={(e) => updateEmailConfig('serviceId', e.target.value)}
                                                        className="w-full px-3 py-2 border border-gray-300 rounded-md text-sm"
                                                        placeholder="Service ID"
                                                    />
                                                    <input
                                                        type="text"
                                                        value={emailConfig.templateId}
                                                        onChange={(e) => updateEmailConfig('templateId', e.target.value)}
                                                        className="w-full px-3 py-2 border border-gray-300 rounded-md text-sm"
                                                        placeholder="Template ID"
                                                    />
                                                </div>
                                            </div>

                                            <div className="grid grid-cols-3 gap-3 border-t pt-4">
                                                <div>
                                                    <label className="block text-sm font-medium text-gray-700 mb-1">Months</label>
                                                    <input
                                                        type="number"
                                                        value={emailConfig.monthsBefore}
                                                        onChange={(e) => updateEmailConfig('monthsBefore', parseInt(e.target.value))}
                                                        className="w-full px-3 py-2 border border-gray-300 rounded-md"
                                                        min="0"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-sm font-medium text-gray-700 mb-1">Weeks</label>
                                                    <input
                                                        type="number"
                                                        value={emailConfig.weeksBefore}
                                                        onChange={(e) => updateEmailConfig('weeksBefore', parseInt(e.target.value))}
                                                        className="w-full px-3 py-2 border border-gray-300 rounded-md"
                                                        min="0"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-sm font-medium text-gray-700 mb-1">Days</label>
                                                    <input
                                                        type="number"
                                                        value={emailConfig.daysBefore}
                                                        onChange={(e) => updateEmailConfig('daysBefore', parseInt(e.target.value))}
                                                        className="w-full px-3 py-2 border border-gray-300 rounded-md"
                                                        min="0"
                                                    />
                                                </div>
                                            </div>
                                        </>
                                    )}

                                    <div className="border-t pt-4">
                                        <label className="flex items-center gap-2 cursor-pointer">
                                            <input
                                                type="checkbox"
                                                checked={emailConfig.automationEnabled}
                                                onChange={(e) => updateEmailConfig('automationEnabled', e.target.checked)}
                                                className="w-5 h-5 text-indigo-600 rounded"
                                            />
                                            <span className="font-semibold text-gray-800">Enable Automated Weekly Emails</span>
                                        </label>
                                        <p className="text-xs text-gray-600 mt-1 ml-7">Automatically sends individual emails when items reach threshold dates (checked once per day)</p>
                                    </div>

                                    {emailStatus && (
                                        <div className="text-center text-sm font-medium text-gray-700 bg-blue-50 p-2 rounded">
                                            {emailStatus}
                                        </div>
                                    )}
                                </div>
                            </div>

                            <div className="bg-white rounded-lg shadow-lg p-6">
                                <h2 className="text-xl font-semibold mb-4 flex items-center gap-2">
                                    <Plus />
                                    Add New Item
                                </h2>
                                <div className="space-y-3">
                                    <input
                                        type="text"
                                        value={newItem.name}
                                        onChange={(e) => setNewItem({ ...newItem, name: e.target.value })}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-md"
                                        placeholder="Item name"
                                    />
                                    <input
                                        type="date"
                                        value={newItem.expiryDate}
                                        onChange={(e) => setNewItem({ ...newItem, expiryDate: e.target.value })}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-md"
                                    />
                                    <input
                                        type="text"
                                        value={newItem.category}
                                        onChange={(e) => setNewItem({ ...newItem, category: e.target.value })}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-md"
                                        placeholder="Category (optional)"
                                    />
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Initial Quantity</label>
                                        <input
                                            type="number"
                                            value={newItem.quantity}
                                            onChange={(e) => setNewItem({ ...newItem, quantity: e.target.value })}
                                            className="w-full px-3 py-2 border border-gray-300 rounded-md"
                                            placeholder="Quantity"
                                            min="0"
                                        />
                                    </div>
                                    <div className="flex gap-2">
                                        <button
                                            onClick={addItem}
                                            className="flex-1 bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700 transition"
                                        >
                                            Add Item
                                        </button>
                                        <label className="flex-1 bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition cursor-pointer flex items-center justify-center gap-2">
                                            <Upload />
                                            Import Excel
                                            <input type="file" accept=".xlsx,.xls" onChange={handleExcelUpload} className="hidden" />
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="bg-white rounded-lg shadow-lg p-6">
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="text-xl font-semibold">Inventory Items ({items.length})</h2>
                                <button
                                    onClick={exportToExcel}
                                    className="bg-gray-600 text-white px-4 py-2 rounded-md hover:bg-gray-700 transition flex items-center gap-2"
                                >
                                    <Download />
                                    Export
                                </button>
                            </div>

                            {sortedItems.length === 0 ? (
                                <div className="text-center py-12 text-gray-500">
                                    <AlertCircle />
                                    <p className="mt-3">No items yet. Add items manually or import from Excel.</p>
                                </div>
                            ) : (
                                <div className="space-y-3">
                                    {sortedItems.map((item) => {
                                        const daysUntil = getDaysUntilExpiry(item.expiryDate);
                                        const alert = getAlertStatus(item);
                                        
                                        return (
                                            <div
                                                key={item.id}
                                                className={`${alert.color} border-2 rounded-lg p-4`}
                                            >
                                                <div className="flex justify-between items-start mb-2">
                                                    <div className="flex-1">
                                                        <h3 className="font-semibold text-lg text-gray-800">{item.name}</h3>
                                                        <div className="flex gap-4 text-sm mt-1">
                                                            <span className="text-gray-600">Expires: {item.expiryDate}</span>
                                                            {item.category && <span className="text-gray-600">Category: {item.category}</span>}
                                                        </div>
                                                    </div>
                                                    <div className="flex items-center gap-4">
                                                        <div className={`${alert.textColor} font-bold text-right`}>
                                                            {daysUntil < 0 ? (
                                                                <span>EXPIRED</span>
                                                            ) : (
                                                                <span>{daysUntil} days left</span>
                                                            )}
                                                        </div>
                                                        <button
                                                            onClick={() => deleteItem(item.id)}
                                                            className="text-red-600 hover:text-red-800 transition"
                                                        >
                                                            <Trash />
                                                        </button>
                                                    </div>
                                                </div>
                                                <div className="flex items-center justify-between pt-3 border-t border-gray-300">
                                                    <div className="flex items-center gap-3">
                                                        <Package />
                                                        <span className="text-sm font-medium text-gray-700">Quantity:</span>
                                                        <div className="flex items-center gap-2 bg-white rounded-md px-3 py-1 border border-gray-300">
                                                            <button
                                                                onClick={() => updateItemQuantity(item.id, -1)}
                                                                className="text-red-600 hover:text-red-800 transition"
                                                            >
                                                                <Minus />
                                                            </button>
                                                            <span className="font-bold text-lg min-w-[40px] text-center">{item.quantity || 0}</span>
                                                            <button
                                                                onClick={() => updateItemQuantity(item.id, 1)}
                                                                className="text-green-600 hover:text-green-800 transition"
                                                            >
                                                                <Plus />
                                                            </button>
                                                        </div>
                                                    </div>
                                                    <button
                                                        onClick={() => sendManualTestEmail(item)}
                                                        className="bg-indigo-600 text-white px-3 py-1 rounded-md hover:bg-indigo-700 transition text-sm flex items-center gap-1"
                                                    >
                                                        <Mail />
                                                        Test Email
                                                    </button>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<InventoryTracker />, document.getElementById('root'));
    </script>
</body>
</html>
